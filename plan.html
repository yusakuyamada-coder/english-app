<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あなただけの1週間プラン｜msc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDEC97; --card:#FFFFFF; --ink:#23284A; --muted:#5A5F7D;
  --blue:#4862AC; --pale:#D6DFF2; --coral:#E0623B; --pink:#EC8FB6; --green:#5DB572; --sun:#F4C34A;
  --on-strong:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2445; --card:#2A3260; --ink:#F6F1DC; --muted:#B8BDD8;
    --blue:#8EA4E8; --pale:#38427C; --coral:#F2865F; --pink:#F2A6C6; --green:#7FCB90; --sun:#F4C34A;
    --on-strong:#1E2445; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2445; --card:#2A3260; --ink:#F6F1DC; --muted:#B8BDD8;
  --blue:#8EA4E8; --pale:#38427C; --coral:#F2865F; --pink:#F2A6C6; --green:#7FCB90; --sun:#F4C34A;
  --on-strong:#1E2445; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  font-weight:500;line-height:1.85;letter-spacing:.06em;font-size:16px}
button{font:inherit;letter-spacing:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:48px 20px 96px}

/* decorations */
.deco{position:absolute;pointer-events:none}
.d-ast{width:40px;color:var(--coral);left:-6px;top:520px}
.d-flower{width:56px;right:4px;top:600px}
.d-burst{width:58px;color:var(--blue);left:10px;bottom:40px}
.d-squig{width:34px;color:var(--sun);right:24px;bottom:120px}
.d-green{width:36px;color:var(--green);right:-4px;bottom:30px}

/* octagon card + tilted label (from the brand page) */
.oct{position:relative;background:var(--card);
  clip-path:polygon(5% 0,94% 0,100% 11%,99% 86%,92% 100%,7% 100%,0 89%,1% 10%);
  padding:72px 32px 52px}
.tag{position:relative;z-index:2;display:inline-block;margin:0 0 -30px 6px}
.tag .en{display:inline-block;background:var(--pale);color:var(--coral);font-family:"DM Serif Display",Georgia,serif;
  font-size:40px;line-height:1;padding:12px 22px 14px;transform:rotate(-6deg);letter-spacing:.02em}
.tag .ja{display:block;width:max-content;background:var(--coral);color:#fff;font-size:14px;font-weight:700;padding:4px 18px;margin:-6px 0 0 54px}
.rocket{position:absolute;right:-6px;top:-34px;width:96px;z-index:3}

.hero h1{font-size:clamp(26px,6vw,36px);line-height:1.7;font-weight:800;margin:0 0 18px}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{color:var(--blue);font-weight:700;margin:0 0 30px;max-width:30em}
.btn{border:0;border-radius:999px;padding:15px 34px;background:var(--coral);color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--coral) 60%,#000);transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:none;padding:15px 6px}

.bubble{position:relative;display:inline-block;border:2px solid var(--blue);background:var(--card);color:var(--blue);
  font-weight:700;padding:10px 20px;margin:28px 0 0 44px;font-size:15px}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;width:12px;height:12px;background:var(--card);
  border-left:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:translateY(-50%) rotate(45deg) translate(4px,-4px)}

/* quiz */
.quizcard{padding-top:56px}
.steps{display:flex;gap:6px;margin:0 0 22px;flex-wrap:wrap}
.steps i{width:22px;height:22px;border-radius:50%;background:var(--pale)}
.steps i.on{background:var(--coral)}
.steps i.now{background:var(--blue)}
.q h2{font-size:clamp(21px,5vw,26px);line-height:1.6;margin:0 0 4px;font-weight:800}
.q .hint{color:var(--muted);font-size:14px;margin:0 0 22px;min-height:1em}
.opts{display:grid;gap:12px;margin:0 0 30px}
.opts.cols{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--blue);border-radius:16px;
  padding:14px 18px;font-size:16px;line-height:1.6;font-weight:700;transition:transform .15s}
.opt small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:.03em}
.opt[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff;transform:rotate(-1.2deg) scale(1.01)}
.opt[aria-pressed="true"] small{color:#fff}
textarea{width:100%;min-height:120px;border:2px solid var(--blue);border-radius:16px;padding:14px;font:inherit;
  background:var(--card);color:var(--ink);resize:vertical;margin:0 0 30px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* loading */
.loading{text-align:center;padding:30px 0 10px}
.loading svg{width:110px;animation:fly 1.6s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6px,-12px) rotate(4deg)}}
.loading p{color:var(--blue);font-weight:700}

/* result */
.plan h2{font-size:clamp(26px,6vw,36px);line-height:1.55;margin:0 0 8px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.chip{background:var(--blue);color:var(--on-strong);border-radius:999px;font-size:13px;font-weight:700;padding:3px 14px}
.msg{margin:22px 0 0;color:var(--ink)}
.notice{background:var(--card);border:2px dashed var(--coral);border-radius:14px;padding:12px 18px;margin:28px 0 0;font-size:14px}

.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px 22px;margin:36px 0 0}
.day{position:relative;padding:34px 22px 22px;border-radius:6px}
.day:nth-child(odd){transform:rotate(-1.6deg)}
.day:nth-child(even){transform:rotate(1.4deg)}
.day .lbl{position:absolute;top:-16px;left:16px;background:var(--card);color:var(--coral);
  font-family:"DM Serif Display",Georgia,serif;font-size:24px;line-height:1;padding:7px 14px 9px;transform:rotate(-4deg);letter-spacing:.02em;
  box-shadow:0 0 0 2px var(--coral) inset}
.day h3{font-size:18px;margin:0 0 8px;line-height:1.55;font-weight:800}
.day ul{margin:0;padding-left:1.1em;font-size:15px;line-height:1.75}
.day li{margin:3px 0}
.c-coral{background:var(--coral);color:#fff}
.c-blue{background:var(--blue);color:var(--on-strong)}
.c-pale{background:var(--pale);color:var(--ink)}
.c-pink{background:var(--pink);color:#23284A}
.c-white{background:var(--card);color:var(--ink)}
.c-sun{background:var(--sun);color:#23284A}

.tips{position:relative;margin:64px auto 0;max-width:520px;background:var(--blue);color:var(--on-strong);
  padding:30px 32px;transform:rotate(-2deg)}
.tips h3{margin:0 0 8px;font-size:19px}
.tips ul{margin:0;padding-left:1.1em}
.end{text-align:center;margin:56px 0 0}
.fine{font-size:13px;color:var(--muted);margin:16px 0 0}
.tag.sect{margin-top:64px}
.tag.sect .en{font-size:32px}
.routine-card{padding-top:60px}
.routine{list-style:none;margin:0;padding:0;counter-reset:s}
.routine li{position:relative;counter-increment:s;padding:0 0 22px 52px;margin:0 0 22px;border-bottom:2px dotted var(--pale)}
.routine li:last-child{border-bottom:0;margin-bottom:8px}
.routine li::before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;
  background:var(--coral);color:#fff;font-weight:800;display:grid;place-items:center;font-size:17px;letter-spacing:0}
.r-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.r-step{font-size:19px;font-weight:800}
.r-min{background:var(--pale);color:var(--blue);border-radius:999px;font-size:13px;font-weight:700;padding:1px 12px}
.r-how{margin:6px 0 0;line-height:1.9}
.minimum{display:flex;flex-direction:column;gap:2px;background:var(--sun);color:#23284A;padding:16px 22px;margin:20px 0 0;transform:rotate(-1.5deg)}
.minimum strong{font-size:14px}
.ph-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 4px}
.ph-days{font-weight:800;font-size:15px;padding:4px 14px;border-radius:999px}
.ph-name{margin:0;font-size:22px;font-weight:800;line-height:1.5}
.ph-goal{margin:0 0 24px;color:var(--blue);font-weight:700}
.minimum.solo{max-width:560px;margin:48px auto 0}
.day .range{margin:0;font-size:13px;font-weight:700;opacity:.85}
.day .goal{margin:6px 0 10px;font-weight:700;line-height:1.7}
.day .focus{margin:0;font-size:15px;line-height:1.8}
.day .focus strong{display:block;font-size:13px;opacity:.85}
.opts.row{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.opts.row .opt{text-align:center;padding:12px 6px}
.typecard{position:relative;max-width:560px;margin:56px auto 0;background:var(--coral);color:#fff;padding:30px 32px;transform:rotate(1.6deg);border-radius:4px}
.type-lbl{margin:0;font-weight:700;font-size:14px;opacity:.9}
.type-name{margin:2px 0 10px;font-size:clamp(24px,6vw,32px);font-weight:800;line-height:1.4}
.type-desc{margin:0;line-height:1.9}
.goal-card{padding:60px 32px 44px}
.goal-text{margin:0;font-size:clamp(19px,4.6vw,23px);font-weight:800;line-height:1.7;color:var(--ink);
  background:linear-gradient(transparent 62%, color-mix(in srgb,var(--sun) 70%,transparent) 62%);display:inline}
.r-why{margin:6px 0 0;color:var(--blue);font-weight:700;line-height:1.8}
.light{background:var(--pale);color:var(--ink);padding:16px 22px;margin:8px 0 0;border-radius:8px}
.light strong{display:block;font-size:14px;margin-bottom:4px}
.light p{margin:4px 0 0;font-size:15px;line-height:1.8}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:40px 0 0}
.wk{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:14px 18px}
.wk.busy{background:var(--pale);border-style:dashed}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-day{font-family:"DM Serif Display",Georgia,serif;font-size:26px;color:var(--coral);line-height:1}
.wk-min{font-size:12px;font-weight:700;background:var(--blue);color:var(--on-strong);border-radius:999px;padding:1px 10px}
.wk.busy .wk-min{background:var(--sun);color:#23284A}
.wk-when{margin:8px 0 2px;font-size:13px;color:var(--muted);font-weight:700}
.wk-todo{margin:0;font-size:15px;line-height:1.75}
.it{padding:10px 0;border-top:1px dashed color-mix(in srgb,var(--on-strong) 40%,transparent)}
.it:first-of-type{border-top:0}
.it-if{margin:0;font-weight:700}
.it-then{margin:2px 0 0}
/* ===== 結果カード（スマホ1画面） ===== */
body.result-mode .deco{display:none}
body.result-mode .wrap{padding:10px 14px 12px;max-width:460px}
.pcard{position:relative;background:var(--card);color:var(--ink);
  clip-path:polygon(6% 0,94% 0,100% 4%,100% 96%,94% 100%,6% 100%,0 96%,0 4%);
  padding:16px 16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  min-height:calc(100svh - 84px)}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-tag{font-family:"DM Serif Display",Georgia,serif;font-size:22px;color:var(--coral);background:var(--pale);padding:3px 12px 5px;transform:rotate(-5deg);line-height:1;letter-spacing:.02em}
.pc-course{background:var(--blue);color:var(--on-strong);font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pc-notice{margin:0;font-size:11px;color:var(--muted);line-height:1.5}
.pc-k{margin:0;font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.04em}
.pc-type{padding:2px 0}
.pc-name{margin:0;font-size:clamp(22px,6.6vw,28px);font-weight:800;color:var(--coral);line-height:1.3}
.pc-catch{margin:2px 0 0;font-size:14px;font-weight:700;line-height:1.5}
.pc-block{display:flex;flex-direction:column;gap:4px}
.pc-goal{margin:0;font-size:clamp(15px,4.4vw,18px);font-weight:800;line-height:1.6}
.pc-goal span{background:linear-gradient(transparent 60%, color-mix(in srgb,var(--sun) 70%,transparent) 60%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pc-focus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:f}
.pc-focus li{position:relative;padding-left:32px;counter-increment:f;line-height:1.4}
.pc-focus li::before{content:counter(f);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;letter-spacing:0}
.pc-focus b{display:block;font-size:15px}
.pc-focus span{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.pc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pc-day{border:2px solid var(--blue);border-radius:10px;padding:5px 1px 6px;text-align:center;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pc-day.busy{background:var(--pale);border-style:dashed}
.pc-day b{font-size:15px;color:var(--coral);line-height:1.2}
.pc-day span{font-size:min(2.35vw,10.5px);line-height:1.3;font-weight:700;letter-spacing:-.03em;word-break:break-all}
.pc-rescue{background:var(--sun);color:#23284A;padding:8px 14px;transform:rotate(-1deg);display:flex;flex-direction:column;line-height:1.45}
.pc-rescue span{font-size:12.5px;font-weight:700}
.pc-rescue b{font-size:14.5px}
.pc-actions{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0 0}
.pc-actions .btn{padding:12px 26px;font-size:16px}
.pc-detail{background:var(--card);border-radius:14px;padding:18px 20px;margin:18px 0 0}
.pc-detail h3{font-size:16px;margin:16px 0 6px}
.pc-msg{margin:0;line-height:1.8}
.pc-d-item{margin:8px 0 0;font-weight:800}
.pc-d-how{margin:2px 0 0;font-size:14px;line-height:1.8}
.pc-d-week{margin:0;padding-left:1.1em;font-size:14px;line-height:1.8}
.pc-detail .btn{display:block;margin:14px auto 0}
.overlay{position:fixed;inset:0;background:rgba(20,24,50,.72);display:grid;place-items:center;padding:16px;z-index:50}
.ov-box{background:var(--card);border-radius:18px;padding:14px;max-width:360px;width:100%;text-align:center;max-height:calc(100svh - 32px);display:flex;flex-direction:column;gap:8px}
.ov-box img{width:100%;height:auto;max-height:calc(100svh - 180px);object-fit:contain;border-radius:10px;background:var(--bg);min-height:200px;-webkit-touch-callout:default}
.ov-status{margin:0;font-size:13px;color:var(--muted)}
.ov-actions{display:flex;justify-content:center;gap:8px}
.ov-actions .btn{padding:11px 24px;font-size:15px}
@media (min-height:880px){ .pcard{gap:14px;padding:22px 22px} }
[hidden]{display:none!important}

@media (max-width:560px){
  .oct{padding:64px 22px 44px}
  .rocket{width:72px;right:-4px;top:-24px}
  .bubble{margin-left:20px}
  .d-ast,.d-flower{display:none}
}
@media (prefers-reduced-motion:reduce){
  .loading svg{animation:none}
  .opt,.btn{transition:none}
}
</style>
</head>
<body>
<main class="wrap">

<!-- decorations -->
<svg class="deco d-ast" viewBox="0 0 40 40" aria-hidden="true"><g stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M20 4v32M4 20h32M8 8l24 24M32 8L8 32"/></g></svg>
<svg class="deco d-flower" viewBox="0 0 60 60" aria-hidden="true"><path fill="var(--pink)" d="M30 4c6 0 7 10 11 12s14-2 15 4-9 8-9 13 7 12 2 16-11-4-17-4-12 9-17 5 1-12-1-17S0 26 3 20s12-1 16-4 5-12 11-12z"/><path d="M23 26l3 3m0-3l-3 3M34 26l3 3m0-3l-3 3M24 35q6 5 12 0" stroke="var(--sun)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
<svg class="deco d-burst" viewBox="0 0 60 60" aria-hidden="true"><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M30 4v52M4 30h52M11 11l38 38M49 11L11 49M18 6l24 48M6 42l48-24"/></g><circle cx="30" cy="30" r="6" fill="var(--pink)"/></svg>
<svg class="deco d-squig" viewBox="0 0 34 60" aria-hidden="true"><path d="M8 4q18 4 8 14t8 14q10 10-8 14t10 12" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>
<svg class="deco d-green" viewBox="0 0 40 40" aria-hidden="true"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M20 5v30M7 13l26 14M33 13L7 27"/></g></svg>

<template id="rocketTpl">
<svg viewBox="0 0 100 100" aria-hidden="true">
  <g transform="rotate(35 50 50)">
    <path d="M42 70 Q50 98 58 70 Q54 86 50 92 Q46 86 42 70z" fill="var(--coral)"/>
    <path d="M45 70 Q50 88 55 70z" fill="var(--pink)"/>
    <path d="M38 52 L26 70 L40 64z M62 52 L74 70 L60 64z" fill="var(--green)"/>
    <path d="M50 6 Q66 24 62 68 L38 68 Q34 24 50 6z" fill="var(--blue)"/>
    <path d="M50 6 Q58 14 60 22 L40 22 Q42 14 50 6z" fill="var(--coral)"/>
    <circle cx="50" cy="38" r="7" fill="var(--sun)"/>
  </g>
</svg>
</template>

<section id="intro">
  <div class="tag"><span class="en">MY PLAN</span><span class="ja">あなただけの1週間プラン</span></div>
  <div class="oct hero">
    <span class="rocket" data-rocket></span>
    <h1>英語を、<br>あなたの毎日に<br><em>ぴったりのかたち</em>で。</h1>
    <p>10の質問に答えると、あなたのタイプ・今週のゴール・主役メニュー・1週間がひと目でわかるプランが届きます。待受画像にして保存もできます。</p>
    <button class="btn" id="start">はじめる</button>
  </div>
  <div class="bubble">まずは1週間、いっしょに一歩ふみ出してみよう</div>
</section>

<section id="quiz" hidden>
  <div class="tag"><span class="en">Q.</span><span class="ja" id="qnum">質問 1 / 10</span></div>
  <div class="oct quizcard">
    <div class="steps" id="steps" aria-hidden="true"></div>
    <div class="q" id="qbox"></div>
    <div class="nav">
      <button class="btn ghost" id="back">戻る</button>
      <button class="btn" id="next" disabled>次へ</button>
    </div>
  </div>
</section>

<section id="result" hidden aria-live="polite"></section>

<div id="imgOverlay" class="overlay" hidden>
  <div class="ov-box" role="dialog" aria-label="待受画像">
    <img id="imgPreview" alt="あなただけの1週間プランの画像">
    <p id="imgStatus" class="ov-status"></p>
    <div class="ov-actions">
      <button class="btn" id="imgSave">保存する</button>
      <button class="btn ghost" id="imgClose">とじる</button>
    </div>
  </div>
</div>

</main>

<script>
/* =========================================================
   設定
   ========================================================= */
// 本番（Vercelなど）では "/api/plan" を指定するとGeminiで生成します。
// 空のままだと、claude.ai上のプレビューではClaudeで生成します。
const AI_ENDPOINT = "/api/plan";

// 編集ポイント①：コース（会員が自分で選びます）
// menu は曜日ごとのアプリのメニュー。AIはこの順番どおりにやり方を提案します（api/plan.js の COURSE_INFO も同じ内容に）
const COURSES = [
  { name:"大人のやり直し英語55",
    short:"55の英語の型を1週間に1つずつ。文法も発音もこれからの人に",

const $ = id => document.getElementById(id);

$("start").onclick = () => { $("intro").hidden = true; $("quiz").hidden = false; render(); window.scrollTo(0,0); };
$("back").onclick = () => { if (step === 0){ $("quiz").hidden = true; $("intro").hidden = false; return; } step--; render(); };
$("next").onclick = () => { if (step < QUESTIONS.length - 1){ step++; render(); } else finish(); };

function render(){
  const Q = QUESTIONS[step];
  $("qnum").textContent = `質問 ${step+1} / ${QUESTIONS.length}`;
  $("steps").innerHTML = QUESTIONS.map((_,i)=>`<i class="${i<step?'on':i===step?'now':''}"></i>`).join("");
  const box = $("qbox"); box.innerHTML = "";
  box.append(el("h2",null,Q.q), el("p","hint",Q.hint||""));

  if (Q.type === "text"){
    const t = document.createElement("textarea"); t.value = answers[Q.id] || ""; t.maxLength = 300;
    t.setAttribute("aria-label", Q.q); t.oninput = () => answers[Q.id] = t.value; box.append(t);
    $("next").disabled = false;
  } else {
    const wrap = el("div", Q.type==="course" ? "opts cols" : Q.row ? "opts row" : "opts");
    const list = Q.type==="course" ? COURSES : Q.opts;
    list.forEach((o,i) => {
      const b = el("button","opt");
      if (Q.type==="course"){ b.append(document.createTextNode(o.name), el("small",null,o.short)); }
      else b.textContent = o;
      const cur = answers[Q.id];
      b.setAttribute("aria-pressed", Q.type==="multi" ? (cur||[]).includes(i) : cur===i);
      b.onclick = () => {
        if (Q.type==="multi"){
          const none = Q.opts.indexOf("特になし");
          let s = new Set(answers[Q.id]||[]);
          if (s.has(i)) s.delete(i); else { s.add(i); if (i===none) s = new Set([i]); else s.delete(none); }
          answers[Q.id]=[...s]; render();
        }
        else { answers[Q.id]=i; render(); setTimeout(()=>$("next").click(), 220); }
      };
      wrap.append(b);
    });
    box.append(wrap);
    $("next").disabled = Q.type==="multi" ? !(answers[Q.id]||[]).length : answers[Q.id]===undefined;
  }
  $("next").textContent = step === QUESTIONS.length-1 ? "プランをつくる" : "次へ";
  $("back").textContent = step === 0 ? "はじめに戻る" : "戻る";
}

function payload(){
  const r = {};
  QUESTIONS.slice(1).forEach(Q => {
    if (Q.type==="text") r[Q.q] = (answers[Q.id]||"").trim() || "（記入なし）";
    else if (Q.type==="multi") r[Q.q] = (answers[Q.id]||[]).map(i=>Q.opts[i]).join("、");
    else r[Q.q] = Q.opts[answers[Q.id]];
  });
  const c = COURSES[answers.course];
  const busy = (answers.busy||[]).map(i=>QUESTIONS.find(q=>q.id==="busy").opts[i]).filter(d=>DAYS.includes(d));
  const weak = (answers.weak||[]).map(i=>QUESTIONS.find(q=>q.id==="weak").opts[i]);
  return { answers:r, course:c.name, courseAbout:c.about, common:COMMON, menu:c.menu, minutes:MINUTES[answers.time],
           _busy:busy, _weak:weak, _block:answers.block, _when:QUESTIONS.find(q=>q.id==="when").opts[answers.when] };
}

/* プロンプト（api/plan.js にも同じものがあります。変えるときは両方を） */
function buildPrompt(p){
  return `あなたは英語学習コミュニティ「msc（maho shadowing club）」の学習コーチです。
mscは「英語を通して、自分の可能性を広げるきっかけをつくる」場所。シャドーイングを中心に、忙しい大人が無理なく続けられる学習を大切にしています。
この会員のためだけの「1週間プラン」を作ってください。コースの紹介ではなく、この人の目標・ニガテ・生活・つまずき方から組み立てることが何より大事です。誰にでも当てはまる文章は書かないでください。
このプランはスマホの1画面に収まるカードと、待受画像になります。カードに出す項目は、指定の文字数を必ず守り、短く言い切ってください。

# 会員が選んだコース：${p.course}
${p.courseAbout}
${p.common}

# このコースの曜日ごとのメニュー（アプリで決まっている。1日約15分）
${p.menu.map(b => "・" + b.days + "：" + b.items.join("／")).join("\n")}
補足：「（日本語のみ）」は日本語を聞いて英語を自分で思い出して言う練習。「文字あり」はスクリプトを見ながら、「文字なし」は見ずに行うシャドーイング。

# 会員の回答
${JSON.stringify(p.answers, null, 2)}
使える時間の目安：1日約${p.minutes}分

# 作り方
1. type：回答（特に続かなかった理由・ニガテ・生活）から、この人を言い当てるオリジナルのタイプ名（12字以内）と、このタイプが伸びるための合言葉（20字以内）
2. goal：使いたい場面と目標から、1週間で達成できる具体的なゴールを1つ（28字以内）。できたかどうか本人が確かめられる形に
3. focus：このコースのメニューの教材から、この人のニガテ・目標に特に効くものをちょうど2個（教材名はメニューの表記どおり）。tipはこの人向けのコツ（18字以内）。howはくわしいやり方（回数・再生速度・スクリプトを見るタイミング・できたらOKの基準など、2文）
4. week：月〜日の7日分。labelはその日の主役（その曜日のメニューにある教材を短く。4字以内。例：文字なし／英作文／ラジオ／リズム）。忙しい曜日はbusyをtrueにしてlabelを「5分」にする。todoはその日にやること（1文）で、時間帯や生活の様子も反映する
5. rescue：この人がいちばんくじけそうな瞬間を予想して、if（14字以内、「もし〜」）とthen（18字以内、「〜だけやる」など）。学習報告SNS・質問コーナー・次の月曜から再スタートできる仕組みも使ってよい
6. message：この人へのメッセージ（回答に触れながら2文）
- メニューにない教材・アプリ・レッスン番号は作らない
- 明るく前向きで、ワクワクする口調。上から目線にしない。絵文字は使わない

# 出力形式（JSONのみ。前置きやコードブロックは不要）
{
  "type": {"name": "12字以内", "catch": "20字以内"},
  "goal": "28字以内",
  "focus": [{"item": "教材名", "tip": "18字以内", "how": "2文"}],
  "week": [{"day": "月", "label": "4字以内", "busy": false, "todo": "1文"}],
  "rescue": {"if": "14字以内", "then": "18字以内"},
  "message": "2文"
}
focusはちょうど2個、weekは必ず月〜日の7つ。`;
}

async function generate(p){
  if (AI_ENDPOINT){
    const r = await fetch(AI_ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(p) });
    if (!r.ok) throw { code:"server" };
    const data = await r.json();
    if (data && data.candidates){
      const text = (data.candidates[0]?.content?.parts || []).map(x => x.text || "").join("");
      return JSON.parse(text.match(/\{.*\}/s)[0]);
    }
    return data;
  }
  const sample = samplePromise ? await samplePromise : null;
  if (!sample) throw { code:"unavailable" };
  return await sample.json(buildPrompt(p), { modelTier:"default" });
}

async function finish(){
  $("quiz").hidden = true;
  const res = $("result"); res.hidden = false; res.innerHTML = "";
  const tag = el("div","tag"); tag.append(el("span","en","Wait!"), el("span","ja","プランをつくっています"));
  const card = el("div","oct"); const ld = el("div","loading");
  ld.append($("rocketTpl").content.cloneNode(true), el("p",null,"あなたの回答から、あなただけの1週間を組み立て中…"), el("p","fine","30秒ほどかかることがあります"));
  card.append(ld); res.append(tag, card); window.scrollTo(0,0);

  const p = payload();
  try {
    const plan = await generate(p);
    if (!plan || !Array.isArray(plan.week) || !plan.type || !plan.goal) throw { code:"shape" };
    show(plan, p);
  }
  catch(e){
    const msg = e && e.code==="not_granted" ? "AIの利用が許可されなかったので、基本プランを表示しています。"
              : e && e.code==="rate_limited" ? "混み合っているので、基本プランを表示しています。少し時間をおいて作り直せます。"
              : "AIのプラン作成がうまくいかなかったので、基本プランを表示しています。";
    show(fallback(p), p, msg);
  }
}

/* AIが使えないときの基本プラン（回答からルールで組み立て） */
const WEAK_ITEM = { "聞き取り":["文字なしシャドーイング","ネイティブ英語のヒアリング"], "発音":["文字ありシャドーイング","発音矯正＆フレーズ解説ラジオ","ネイティブ速度シャドーイング"],
  "単語・表現":["リズム単語","リズムチャンク"], "文法":["mahoの文法解説ラジオ","発音矯正＆フレーズ解説ラジオ"], "話そうとすると言葉が出てこない":["瞬間英作文前半","4コマ英作文","リズム単語（日本語のみ）","リズムチャンク（日本語のみ）"] };
const TYPES = [
  {name:"迷子になりがちタイプ", catch:"やることを決めたら、もう迷わない"},
  {name:"忙しさに負けがちタイプ", catch:"5分でも毎日ふれた人が勝つ"},
  {name:"成長が見たいタイプ", catch:"小さなゴールを毎週クリア"},
  {name:"がんばりすぎタイプ", catch:"7割できたら100点"} ];
const RESCUE = [
  {if:"もし何をやるか迷ったら", then:"今日のいちばん上だけやる"},
  {if:"もし時間がとれなかったら", then:"1回聞いてSNSに報告"},
  {if:"もし飽きてきたら", then:"仲間の投稿を3つ見る"},
  {if:"もし全部できなかったら", then:"主役だけで100点"} ];
function shortLabel(it){
  if (it.includes("日本語のみ")) return "日→英";
  if (it.includes("文字なし")) return "文字なし";
  if (it.includes("ネイティブ速度")) return "速度UP";
  if (it.includes("文字あり")) return "文字あり";
  if (it.includes("ラジオ")) return "ラジオ";
  if (it.includes("ヒアリング")) return "ヒアリ";
  if (it.includes("英作文")) return "英作文";
  if (it.includes("リズム")) return "リズム";
  return it.slice(0,4);
}
function tipFor(item){
  if (item.includes("日本語のみ")) return "3秒以内に口を動かす";
  if (item.includes("文字なし")) return "2回目は口パクから声に";
  if (item.includes("ネイティブ速度")) return "リズムに乗れたらOK";
  if (item.includes("文字あり")) return "0.8倍で音のつながりを";
  if (item.includes("ラジオ")) return "ポイントを1つだけメモ";
  if (item.includes("ヒアリング")) return "聞こえた単語を拾う";
  if (item.includes("英作文")) return "答えを見る前に言う";
  if (item.includes("リズム")) return "体を動かして声に出す";
  return "まずは1回通す";
}
function fallback(p){
  const all = p.menu.flatMap(b=>b.items);
  let focus = [...new Set(p._weak.flatMap(w=>WEAK_ITEM[w]||[]).filter(it=>all.includes(it)))];
  [...new Set(all)].forEach(it=>{ if (focus.length<2 && !focus.includes(it) && it.includes("シャドーイング")) focus.push(it); });
  focus = focus.slice(0,2);
  return {
    type: TYPES[p._block] || TYPES[0],
    goal: "お気に入りの1文を、何も見ずに言えるようになる",
    focus: focus.map(it=>({ item:it, tip:tipFor(it), how:howFor(it) })),
    week: DAYS.map(d=>{
      const items = p.menu[dayBlock(d)].items, busy = p._busy.includes(d);
      const main = items.find(i=>focus.includes(i)) || items[0];
      return { day:d, busy, label: busy ? "5分" : shortLabel(main),
        todo: busy ? `「${main}」を1回だけ。できたらOK` : `${p._when}に「${main}」を主役に、ほかのメニューも進める` };
    }),
    rescue: RESCUE[p._block] || RESCUE[0],
    message: "回答をもとに、あなたに合わせた基本プランを用意しました。主役のメニューを中心に、無理なく進めていきましょう。"
  };
}
function howFor(item){
  if (item.includes("日本語のみ")) return "日本語を聞いたら、答えが流れる前に英語を言ってみます。3秒以内に口を動かせたらOK。";
  if (item.includes("文字なし")) return "スクリプトを見ずに、音声のすぐ後ろを追いかけて声に出します。聞き取れないところは口パクでOK、2回目で少し増えれば十分です。";
  if (item.includes("ネイティブ速度")) return "速度を下げずについていきます。全部言えなくても、リズムに乗れたらOK。";
  if (item.includes("文字あり")) return "スクリプトを見ながら、音のつながりを真似して声に出します。むずかしければ再生速度を0.8倍に。";
  if (item.includes("ラジオ")) return "聞きながら、今週の表現のポイントを1つだけメモします。";
  if (item.includes("ヒアリング")) return "何も見ずに聞いて、聞き取れた単語を頭の中で拾います。";
  if (item.includes("英作文")) return "絵を見て状況をつかみ、答えを見る前に自分で英語を言ってから確認します。";
  if (item.includes("リズム")) return "リズムに乗って、体を動かしながら声に出して真似します。";
  return "アプリで今日の教材を開いて取り組みます。";
}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
const cut = (s, n) => { s = String(s||""); return s.length > n ? s.slice(0, n-1) + "…" : s; };

/* 結果：スマホ1画面に収まるカード */
let lastPlan = null, lastP = null;
function normalize(plan, p){
  const fb = fallback(p);
  const t = plan.type || fb.type;
  const focus = (plan.focus||[]).slice(0,2); while (focus.length < 2 && fb.focus[focus.length]) focus.push(fb.focus[focus.length]);
  const week = DAYS.map((d,i)=>{ const w = (plan.week||[]).find(x=>x && x.day===d) || (plan.week||[])[i] || fb.week[i]; return { ...w, day:d }; });
  return {
    type:{ name:cut(t.name||fb.type.name,14), catch:cut(t.catch||fb.type.catch,24) },
    goal:cut(plan.goal||fb.goal,34),
    focus:focus.map(f=>({ item:f.item||"", tip:cut(f.tip||tipFor(f.item||""),22), how:f.how||howFor(f.item||"") })),
    week:week.map(w=>({ day:w.day, busy:!!w.busy, label:cut(w.busy?"5分":(w.label||""),5), todo:w.todo||"" })),
    rescue:{ if:cut((plan.rescue||fb.rescue).if,18), then:cut((plan.rescue||fb.rescue).then,22) },
    message:plan.message||fb.message
  };
}

function show(raw, p, notice){
  const plan = normalize(raw, p); lastPlan = plan; lastP = p;
  document.body.classList.add("result-mode");
  const res = $("result"); res.innerHTML = "";

  const card = el("div","pcard");
  const top = el("div","pc-top");
  top.append(el("span","pc-tag","MY PLAN"), el("span","pc-course",p.course));
  card.append(top);
  if (notice) card.append(el("p","pc-notice",notice));

  const ty = el("div","pc-type");
  ty.append(el("p","pc-k","あなたは"), el("p","pc-name",plan.type.name), el("p","pc-catch",plan.type.catch));
  card.append(ty);

  const g = el("div","pc-block");
  const gp = el("p","pc-goal"); gp.append(el("span",null,plan.goal)); g.append(el("p","pc-k","今週のゴール"), gp);
  card.append(g);

  const f = el("div","pc-block");
  f.append(el("p","pc-k","あなたの主役メニュー"));
  const ol = el("ol","pc-focus");
  plan.focus.forEach(x=>{ const li = el("li"); li.append(el("b",null,x.item), el("span",null,x.tip)); ol.append(li); });
  f.append(ol); card.append(f);

  const w = el("div","pc-block");
  w.append(el("p","pc-k","あなたの1週間"));
  const row = el("div","pc-week");
  plan.week.forEach(d=>{ const c = el("div","pc-day"+(d.busy?" busy":"")); c.append(el("b",null,d.day), el("span",null,d.label)); row.append(c); });
  w.append(row); card.append(w);

  const rs = el("div","pc-rescue");
  rs.append(el("span",null,plan.rescue.if), el("b",null,"→ "+plan.rescue.then));
  card.append(rs);
  res.append(card);

  const act = el("div","pc-actions");
  const save = el("button","btn","画像で保存");
  save.onclick = () => openImage(plan, p);
  const more = el("button","btn ghost","くわしく見る");
  act.append(save, more);
  res.append(act);

  // くわしく（タップで開く）
  const det = el("div","pc-detail"); det.hidden = true;
  det.append(el("p","pc-msg",plan.message));
  det.append(el("h3",null,"主役メニューのやり方"));
  plan.focus.forEach(x=>{ det.append(el("p","pc-d-item",x.item), el("p","pc-d-how",x.how)); });
  det.append(el("h3",null,"曜日ごとにやること"));
  const ul = el("ul","pc-d-week");
  plan.week.forEach(d=>{ const li = el("li"); li.append(el("b",null,d.day+"："), document.createTextNode(d.todo)); ul.append(li); });
  det.append(ul);
  const again = el("button","btn ghost","もう一度つくる");
  again.onclick = () => { step=0; for(const k in answers) delete answers[k]; res.hidden=true; document.body.classList.remove("result-mode"); $("intro").hidden=false; window.scrollTo(0,0); };
  det.append(again);
  res.append(det);
  more.onclick = () => { det.hidden = !det.hidden; more.textContent = det.hidden ? "くわしく見る" : "とじる"; if (!det.hidden) det.scrollIntoView({behavior:"smooth"}); };

  window.scrollTo(0,0);
}

/* ===== 待受画像（1080×1920） ===== */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function wrapLines(ctx, text, maxW, maxLines){
  const lines = []; let cur = "";
  for (const ch of String(text)){
    if (ctx.measureText(cur+ch).width > maxW && cur){ lines.push(cur); cur = ch; if (lines.length === maxLines) break; }
    else cur += ch;
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  const used = lines.join("").length;
  if (used < String(text).length && lines.length){ let l = lines[lines.length-1]; while (l && ctx.measureText(l+"…").width > maxW) l = l.slice(0,-1); lines[lines.length-1] = l+"…"; }
  return lines;
}
function octagon(ctx, x, y, w, h, c){
  ctx.beginPath(); ctx.moveTo(x+c, y); ctx.lineTo(x+w-c, y); ctx.lineTo(x+w, y+c); ctx.lineTo(x+w, y+h-c);
  ctx.lineTo(x+w-c, y+h); ctx.lineTo(x+c, y+h); ctx.lineTo(x, y+h-c); ctx.lineTo(x, y+c); ctx.closePath();
}
function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
function star(ctx, cx, cy, r, color, lw){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round";
  for (let i=0;i<4;i++){ const a = i*Math.PI/4; ctx.beginPath(); ctx.moveTo(cx-Math.cos(a)*r, cy-Math.sin(a)*r); ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); ctx.stroke(); }
  ctx.restore();
}
async function renderWallpaper(plan, p){
  const R = "'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif", S = "'DM Serif Display', Georgia, serif";
  const allText = JSON.stringify(plan) + p.course + "MY PLANあなたは今週のゴール主役メニュー1週間maho shadowing club→…" + DAYS.join("");
  try { await Promise.all([document.fonts.load(`800 60px "M PLUS Rounded 1c"`, allText), document.fonts.load(`700 40px "M PLUS Rounded 1c"`, allText), document.fonts.load(`40px "DM Serif Display"`, "MY PLAN")]); } catch(e){}
  const W = 1080, H = 1920, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const C = { bg:"#FDEC97", card:"#FFFFFF", ink:"#23284A", muted:"#5A5F7D", blue:"#4862AC", pale:"#D6DFF2", coral:"#E0623B", pink:"#EC8FB6", green:"#5DB572", sun:"#F4C34A" };
  x.fillStyle = C.bg; x.fillRect(0,0,W,H);
  // 時計の場所をあけて、上はかざりだけ
  star(x, 120, 300, 34, C.coral, 14); star(x, 960, 420, 28, C.green, 14);
  x.fillStyle = C.pink; x.beginPath(); x.arc(940, 250, 26, 0, Math.PI*2); x.fill();
  x.fillStyle = C.sun; x.beginPath(); x.arc(180, 470, 14, 0, Math.PI*2); x.fill();

  const PX = 60, PY = 560, PW = W-120, PH = 1300;
  octagon(x, PX, PY, PW, PH, 70); x.fillStyle = C.card; x.fill();
  // ラベル
  x.save(); x.translate(PX+30, PY-34); x.rotate(-6*Math.PI/180);
  x.fillStyle = C.pale; x.fillRect(0,0,300,84); x.fillStyle = C.coral; x.font = `52px ${S}`; x.textBaseline = "middle"; x.fillText("MY PLAN", 26, 46); x.restore();
  x.font = `700 28px ${R}`; const cw = x.measureText(p.course).width + 44;
  x.fillStyle = C.blue; rrect(x, PX+PW-cw-50, PY+40, cw, 50, 25); x.fill();
  x.fillStyle = "#fff"; x.textBaseline = "middle"; x.fillText(p.course, PX+PW-cw-28, PY+66);

  const L = PX+70, MW = PW-140; let y = PY+150;
  x.textBaseline = "alphabetic";
  const k = (t) => { x.fillStyle = C.blue; x.font = `700 30px ${R}`; x.fillText(t, L, y); y += 20; };
  // タイプ
  k("あなたは"); y += 66;
  x.fillStyle = C.coral; x.font = `800 72px ${R}`; wrapLines(x, plan.type.name, MW, 1).forEach(l=>{ x.fillText(l, L, y); y += 84; });
  x.fillStyle = C.ink; x.font = `700 36px ${R}`; wrapLines(x, plan.type.catch, MW, 1).forEach(l=>{ x.fillText(l, L, y); y += 50; });
  y += 22;
  // ゴール
  k("今週のゴール"); y += 56;
  x.font = `800 44px ${R}`;
  wrapLines(x, plan.goal, MW, 2).forEach(l=>{ const w = x.measureText(l).width; x.fillStyle = C.sun; x.globalAlpha = .7; x.fillRect(L-4, y-16, w+8, 22); x.globalAlpha = 1; x.fillStyle = C.ink; x.fillText(l, L, y); y += 62; });
  y += 20;
  // 主役メニュー
  k("あなたの主役メニュー"); y += 22;
  plan.focus.forEach((f,i)=>{
    x.fillStyle = C.coral; x.beginPath(); x.arc(L+26, y+26, 26, 0, Math.PI*2); x.fill();
    x.fillStyle = "#fff"; x.font = `800 30px ${R}`; x.textAlign = "center"; x.fillText(String(i+1), L+26, y+37); x.textAlign = "left";
    x.fillStyle = C.ink; x.font = `800 38px ${R}`; x.fillText(wrapLines(x, f.item, MW-80, 1)[0]||"", L+74, y+40);
    x.fillStyle = C.muted; x.font = `700 30px ${R}`; x.fillText(wrapLines(x, f.tip, MW-80, 1)[0]||"", L+74, y+86);
    y += 104;
  });
  y += 44;
  // 1週間
  k("あなたの1週間"); y += 26;
  const gap = 10, cwid = (MW - gap*6)/7, ch = 130;
  plan.week.forEach((d,i)=>{
    const cx = L + i*(cwid+gap);
    rrect(x, cx, y, cwid, ch, 16); x.fillStyle = d.busy ? C.pale : C.card; x.fill();
    x.lineWidth = 3; x.strokeStyle = C.blue; if (d.busy) x.setLineDash([8,6]); x.stroke(); x.setLineDash([]);
    x.textAlign = "center"; x.fillStyle = C.coral; x.font = `800 36px ${R}`; x.fillText(d.day, cx+cwid/2, y+48);
    x.fillStyle = C.ink; x.font = `700 22px ${R}`;
    wrapLines(x, d.label, cwid-8, 2).forEach((l,j)=> x.fillText(l, cx+cwid/2, y+86+j*28));
    x.textAlign = "left";
  });
  y += ch + 30;
  // くじけそうな時
  x.save(); x.translate(L-10, y); x.rotate(-1.5*Math.PI/180);
  x.fillStyle = C.sun; x.fillRect(0, 0, MW+20, 112);
  x.fillStyle = C.ink; x.font = `700 30px ${R}`; x.fillText(wrapLines(x, plan.rescue.if, MW-20, 1)[0]||"", 30, 48);
  x.font = `800 34px ${R}`; x.fillText(wrapLines(x, "→ "+plan.rescue.then, MW-20, 1)[0]||"", 30, 96);
  x.restore();
  // フッター
  x.fillStyle = C.blue; x.font = `700 26px ${R}`; x.textAlign = "center"; x.fillText("maho shadowing club", W/2, 1898); x.textAlign = "left";
  return await new Promise(r => c.toBlob(r, "image/png"));
}

let imgURL = null;
async function openImage(plan, p){
  const ov = $("imgOverlay"), img = $("imgPreview"), st = $("imgStatus");
  ov.hidden = false; img.removeAttribute("src"); st.textContent = "画像をつくっています…";
  const blob = await renderWallpaper(plan, p);
  if (imgURL) URL.revokeObjectURL(imgURL);
  imgURL = URL.createObjectURL(blob); img.src = imgURL;
  st.textContent = "画像を長押しでも保存できます";
  $("imgSave").onclick = () => saveImage(blob);
}
async function saveImage(blob){
  const name = "msc-my-plan.png", st = $("imgStatus");
  try {
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if (dl){ await dl.save({ filename:name, data:blob }); st.textContent = "保存しました。待受に設定してみてね"; return; }
  } catch(e){ if (e && e.code === "declined") return; }
  try {
    const file = new File([blob], name, { type:"image/png" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); st.textContent = "「画像を保存」を選ぶと写真に入ります"; return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = imgURL; a.download = name; document.body.append(a); a.click(); a.remove();
  st.textContent = "保存できない場合は、画像を長押しして保存してね";
}
document.addEventListener("click", e => { if (e.target.id === "imgClose" || e.target.id === "imgOverlay") $("imgOverlay").hidden = true; });
