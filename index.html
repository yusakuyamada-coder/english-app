<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Coach AI Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #1D9E75; --bg: #ffffff; --text: #1a1a18; --radius: 16px; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0efe9; display: flex; justify-content: center; padding: 2rem 1rem; }
    .container { width: 100%; max-width: 500px; }
    .result-card { background: white; border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .score-badge { padding: 6px 16px; background: var(--accent); color: white; border-radius: 999px; font-weight: 700; margin-bottom: 1rem; display: inline-block; }
    .label { font-size: 11px; font-weight: bold; color: #666; text-transform: uppercase; margin-bottom: 4px; }
    .val-you { color: #E24B4A; font-weight: 600; margin-bottom: 12px; font-size: 16px; }
    .val-better { color: var(--accent); font-weight: 700; margin-bottom: 12px; font-size: 18px; }
    .feedback { background: #f7f7f5; padding: 15px; border-radius: 10px; font-size: 14px; border-left: 5px solid var(--accent); line-height: 1.6; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 2rem; }
    .rec-btn { width: 85px; height: 85px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 35px; box-shadow: 0 8px 20px rgba(29, 158, 117, 0.3); }
    .rec-btn.recording { background: #E24B4A; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <div class="container">
    <div id="resultCard" class="result-card">
      <div id="scoreBadge" class="score-badge">Score: 0</div>
      <div class="label">Your Speech:</div>
      <div id="userAns" class="val-you"></div>
      <div class="label">Natural Expression:</div>
      <div id="betterAns" class="val-better"></div>
      <div id="feedbackText" class="feedback"></div>
    </div>

    <div class="controls">
      <p id="statusText" style="font-weight:600; color:#666;">録音ボタンを押してスタート</p>
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
    </div>
  </div>

  <script>
    let isRecording = false, mediaRecorder = null, audioChunks = [];

    async function toggleRecord() {
      if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('recBtn').classList.remove('recording');
        document.getElementById('statusText').textContent = 'AIが解析中...';
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const base64 = await new Promise(r => {
            const rd = new FileReader();
            rd.onload = () => r(rd.result.split(',')[1]);
            rd.readAsDataURL(blob);
          });
          process(base64);
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recBtn').classList.add('recording');
        document.getElementById('statusText').textContent = '話してください...';
      } catch (e) { alert('マイクを許可してください'); }
    }

    async function process(base64) {
     const prompt = `あなたは「学習者の挑戦を心から称賛し、かつ的確にレベルアップさせる」超一流の英語コーチです。

以下のガイドラインに従って、生徒の音声を分析し、JSON形式でのみ回答してください：

1. 精神性: まず、英語で発話しようとした勇気や継続している姿勢を、ポジティブな言葉で全力で褒めてください。
2. 指導: 褒めるだけでなく、プロとして文法ミスや不自然な言い回しは一切妥協せず、正解（Improved）を提示してください。
3. フィードバックの構成: 
   - 冒頭：学習アクションに対する「称賛の言葉」
   - 中盤：なぜ修正が必要かという「論理的な解説」
   - 結び：次へのやる気に繋がる「応援メッセージ」

回答形式（JSONのみ）:
{
  "transcript": "聞き取った英文",
  "improved": "最も自然なネイティブ表現",
  "score": 0〜100（挑戦の姿勢も加味したスコア）,
  "feedback": "（称賛 ＋ 具体的解説 ＋ 応援メッセージ）を日本語で150文字程度"
}`;
      try {
        // 自作したAPIエンドポイントを叩く
        const res = await fetch('/api/correct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64Audio: base64, prompt: prompt })
        });
        
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const result = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('scoreBadge').textContent = `Score: ${result.score}`;
        document.getElementById('userAns').textContent = result.transcript;
        document.getElementById('betterAns').textContent = result.improved;
        document.getElementById('feedbackText').textContent = result.feedback;
        document.getElementById('statusText').textContent = '添削完了！';
      } catch (e) {
        document.getElementById('statusText').innerHTML = `<span style="color:red">エラー: ${e.message}</span>`;
      }
    }
  </script>
</body>
</html>
