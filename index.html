<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>発話くん - 10問チャレンジ</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #1D9E75; --accent-light: #E1F5EE; --bg: #ffffff; --text: #1a1a18; --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0efe9; display: flex; justify-content: center; padding: 1rem; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

    .top-bar { background: white; border-radius: var(--radius); padding: 1rem 1.25rem; border: 0.5px solid #ddd; }
    .top-bar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .challenge-label { font-size: 13px; font-weight: 700; color: var(--accent); }
    .question-counter { font-size: 12px; color: #888; background: #f0efe9; padding: 3px 10px; border-radius: 99px; }
    .progress-track { background: #e5e5e5; border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.4s ease; }

    .question-card { background: white; border-radius: var(--radius); padding: 1.5rem; border: 2px solid var(--accent); text-align: center; }
    .pattern-tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-light); padding: 4px 12px; border-radius: 99px; display: inline-block; border: 1px solid var(--accent); margin-bottom: 12px; }
    .question-ja { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.6; }

    .result-card { background: white; border-radius: var(--radius); padding: 1.5rem; border: 0.5px solid #ddd; display: none; }
    .score-badge { padding: 5px 14px; background: var(--accent); color: white; border-radius: 999px; font-weight: 700; font-size: 13px; display: inline-block; margin-bottom: 12px; }
    .label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.05em; }
    .val-you { color: #E24B4A; font-weight: 600; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
    .val-better { color: var(--accent); font-weight: 700; margin-bottom: 12px; font-size: 15px; line-height: 1.5; }
    .feedback { background: #f7f7f5; padding: 12px 14px; border-radius: 10px; font-size: 13px; border-left: 4px solid var(--accent); line-height: 1.7; white-space: pre-wrap; color: #333; }
    .score-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .score-box { background: #f0efe9; border-radius: 10px; padding: 12px; text-align: center; }
    .score-box .num { font-size: 26px; font-weight: 700; color: var(--accent); }
    .score-box .lbl { font-size: 11px; color: #888; margin-bottom: 4px; }

    .retry-btn { width: 100%; padding: 11px; background: white; color: #888; border: 1px solid #ddd; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 10px; display: none; }
    .retry-btn:hover { background: #f0efe9; }

    .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .rec-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 32px; box-shadow: 0 8px 20px rgba(29,158,117,0.3); transition: background 0.2s; }
    .rec-btn.recording { background: #E24B4A; animation: pulse 1.2s infinite; }
    .rec-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .next-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 99px; font-size: 15px; font-weight: 700; cursor: pointer; display: none; }
    .next-btn:hover { background: #178a63; }
    .restart-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 99px; font-size: 15px; font-weight: 700; cursor: pointer; display: none; }

    .progress-wrap { width: 100%; display: none; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; }
    .progress-wrap.show { display: flex; }
    .analysis-track { width: 100%; background: #e5e5e5; border-radius: 99px; height: 10px; overflow: hidden; }
    .analysis-bar { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.4s ease; }
    .progress-pct { font-size: 24px; font-weight: 700; color: var(--accent); }
    .progress-step { font-size: 12px; color: #888; }

    .final-card { background: white; border-radius: var(--radius); padding: 1.5rem; border: 0.5px solid #ddd; display: none; text-align: center; }
    .final-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .final-sub { font-size: 13px; color: #888; margin-bottom: 16px; }
    .final-score-big { font-size: 56px; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 4px; }
    .final-score-label { font-size: 13px; color: #888; margin-bottom: 20px; }
    .pattern-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid #eee; font-size: 13px; }
    .pattern-row:last-child { border-bottom: none; }
    .pattern-name { color: #555; flex: 1; }
    .pattern-score { font-weight: 700; color: var(--accent); }

    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.3s ease; }
  </style>
</head>
<body>
<div class="container">

  <div class="top-bar" id="topBar">
    <div class="top-bar-row">
      <span class="challenge-label">10問チャレンジ</span>
      <span class="question-counter" id="questionCounter">1 / 10問</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="challengeBar"></div>
    </div>
  </div>

  <div class="question-card" id="questionCard">
    <div id="patternTag" class="pattern-tag">...</div>
    <div id="questionText" class="question-ja">読み込み中...</div>
  </div>

  <div class="result-card fade-in" id="resultCard">
    <div id="scoreBadge" class="score-badge">Score: 0</div>
    <div class="label">Your Answer</div>
    <div id="userAns" class="val-you"></div>
    <div class="label">Correct Answer</div>
    <div id="betterAns" class="val-better"></div>
    <div id="feedbackText" class="feedback"></div>
    <div class="score-summary">
      <div class="score-box">
        <div class="lbl">正解数</div>
        <div class="num" id="correctCount">0 / 0</div>
      </div>
      <div class="score-box">
        <div class="lbl">平均スコア</div>
        <div class="num" id="avgScore">-</div>
      </div>
    </div>
    <!-- やり直しボタン -->
    <button class="retry-btn" id="retryBtn" onclick="retryQuestion()">この問題をもう一度やり直す 🔄</button>
  </div>

  <div class="final-card fade-in" id="finalCard">
    <div class="final-title">チャレンジ完了！ 🎉</div>
    <div class="final-sub">10問お疲れ様でした</div>
    <div class="final-score-big" id="finalScoreBig">-</div>
    <div class="final-score-label">平均スコア</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:20px;">
      <div class="score-box"><div class="lbl">正解数（80点以上）</div><div class="num" id="finalCorrect">-</div></div>
      <div class="score-box"><div class="lbl">最高スコア</div><div class="num" id="finalBest">-</div></div>
    </div>
    <div id="patternBreakdown"></div>
  </div>

  <div class="controls">
    <p id="statusText" style="font-weight:600;color:#666;font-size:13px;">🎤 ボタンを押して英語で回答</p>
    <button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-pct" id="progressPct">0%</div>
      <div class="analysis-track"><div class="analysis-bar" id="analysisBar"></div></div>
      <div class="progress-step" id="progressStep">音声を受信中...</div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ ➔</button>
    <button class="restart-btn" id="restartBtn" onclick="restartChallenge()">もう一度チャレンジ 🔄</button>
  </div>

</div>

const TOTAL = 10;
let challengeQuestions = [];
let currentIndex = 0;
let scores = [];
let patternScores = {};
let pendingScore = null;
let pendingResult = null;
let isRecording = false, mediaRecorder = null, audioChunks = [];
let progressTimer = null;

function startChallenge() {
  const shuffled = [...questionList].sort(() => Math.random() - 0.5);
  challengeQuestions = shuffled.slice(0, TOTAL);
  currentIndex = 0;
  scores = [];
  patternScores = {};
  pendingScore = null;
  pendingResult = null;
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('finalCard').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('recBtn').disabled = false;
  document.getElementById('recBtn').style.display = 'block';
  document.getElementById('statusText').style.display = 'block';
  document.getElementById('topBar').style.display = 'block';
  document.getElementById('questionCard').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = challengeQuestions[currentIndex];
  document.getElementById('patternTag').textContent = q.pattern;
  document.getElementById('questionText').textContent = q.ja;
  document.getElementById('questionCounter').textContent = `${currentIndex + 1} / ${TOTAL}問`;
  document.getElementById('challengeBar').style.width = `${(currentIndex / TOTAL) * 100}%`;
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('statusText').textContent = '🎤 ボタンを押して英語で回答';
  document.getElementById('recBtn').disabled = false;
  pendingScore = null;
  pendingResult = null;
}

startChallenge();

// 次の問題へ → ここでスコアを確定記録
function nextQuestion() {
  if (pendingScore !== null) {
    const q = challengeQuestions[currentIndex];
    scores.push(pendingScore);
    if (!patternScores[q.pattern]) patternScores[q.pattern] = { total: 0, count: 0 };
    patternScores[q.pattern].total += pendingScore;
    patternScores[q.pattern].count++;
    pendingScore = null;
    pendingResult = null;
  }
  currentIndex++;
  if (currentIndex >= TOTAL) {
    showFinalResult();
  } else {
    showQuestion();
  }
}

// やり直し → スコアを記録せず同じ問題を再挑戦
function retryQuestion() {
  pendingScore = null;
  pendingResult = null;
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('statusText').textContent = '🎤 ボタンを押して英語で回答';
  document.getElementById('recBtn').disabled = false;
}

function showFinalResult() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('topBar').style.display = 'none';
  document.getElementById('recBtn').style.display = 'none';
  document.getElementById('statusText').style.display = 'none';

  const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
  const correct = scores.filter(s => s >= 80).length;
  const best = Math.max(...scores);

  document.getElementById('finalScoreBig').textContent = avg;
  document.getElementById('finalCorrect').textContent = `${correct} / ${TOTAL}`;
  document.getElementById('finalBest').textContent = best;

  const breakdown = document.getElementById('patternBreakdown');
  breakdown.innerHTML = '<div style="font-size:13px;font-weight:700;color:#555;margin-bottom:8px;">パターン別スコア</div>';
  Object.entries(patternScores).forEach(([pattern, data]) => {
    const pavg = Math.round(data.total / data.count);
    const row = document.createElement('div');
    row.className = 'pattern-row';
    row.innerHTML = `<span class="pattern-name">${pattern}</span><span class="pattern-score">${pavg}点 (${data.count}問)</span>`;
    breakdown.appendChild(row);
  });

  let msg = avg >= 90 ? '素晴らしい！完璧に近いです 🏆' :
            avg >= 75 ? 'よくできました！着実に上達しています ✨' :
            avg >= 60 ? 'いい調子です！練習を続けましょう 💪' :
                        '次回はもっと良くなります！諦めないで 🌱';
  const msgEl = document.createElement('div');
  msgEl.style.cssText = 'background:#E1F5EE;border-radius:10px;padding:12px;font-size:13px;color:#0F6E56;font-weight:600;margin-top:16px;text-align:center;';
  msgEl.textContent = msg;
  breakdown.appendChild(msgEl);

  document.getElementById('finalCard').style.display = 'block';
  document.getElementById('restartBtn').style.display = 'block';
}

function restartChallenge() {
  startChallenge();
}

// ── プログレスバー ──────────────────────────────────
const STEPS = [
  { pct: 10, label: '音声を受信中...' },
  { pct: 30, label: '音声を文字に変換中...' },
  { pct: 55, label: '英語を解析中...' },
  { pct: 75, label: 'フィードバックを生成中...' },
  { pct: 90, label: 'もうすぐ完了...' },
];

function showProgress() {
  document.getElementById('progressWrap').classList.add('show');
  let i = 0;
  progressTimer = setInterval(() => {
    if (i >= STEPS.length) { clearInterval(progressTimer); return; }
    setProgress(STEPS[i].pct, STEPS[i].label);
    i++;
  }, 900);
}

function completeProgress() {
  clearInterval(progressTimer);
  setProgress(100, '完了！');
  setTimeout(() => {
    document.getElementById('progressWrap').classList.remove('show');
    setProgress(0, '');
  }, 600);
}

function setProgress(pct, label) {
  document.getElementById('analysisBar').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressStep').textContent = label;
}

// ── 録音 ──────────────────────────────────────────
async function toggleRecord() {
  if (isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('recBtn').classList.remove('recording');
    document.getElementById('statusText').textContent = 'AI が分析中...';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: 'audio/webm;codecs=opus',
      audioBitsPerSecond: 16000,
    });
    audioChunks = [];
    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.onstop = async () => {
      if (!audioChunks.length) return;
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const base64 = await new Promise(r => {
        const rd = new FileReader();
        rd.onload = () => r(rd.result.split(',')[1]);
        rd.readAsDataURL(blob);
      });
      processAnswer(base64);
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('statusText').textContent = '話してください...';

    // 30秒で自動停止（分析はしない）
    setTimeout(() => {
      if (isRecording) {
        audioChunks = [];
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('recBtn').classList.remove('recording');
        document.getElementById('statusText').textContent = '録音が長すぎます。もう一度お試しください。';
      }
    }, 30000);

  } catch (e) { alert('マイクを許可してください'); }
}

// ── API処理 ──────────────────────────────────────
async function processAnswer(base64) {
  const q = challengeQuestions[currentIndex];
  showProgress();
  document.getElementById('recBtn').disabled = true;

  const prompt = `あなたはプロの英語コーチです。
生徒に「${q.ja}」という日本語を英語で言わせる練習をさせています。
正解例は「${q.en}」です。
以下のJSON形式でのみ回答してください:
{"transcript":"聞き取った生徒の英語","improved":"${q.en}","score":0-100,"feedback":"まず生徒の良かった点を一言褒めてから、正解例と比較して間違いをやさしく日本語で説明してください。最後に一言励ましの言葉を添えてください。"}`;

  try {
    const res = await fetch('/api/correct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Audio: base64, prompt })
    });
    const data = await res.json();

    if (!data.candidates || !data.candidates[0]) {
      throw new Error('AIの応答がありませんでした。もう一度お試しください。');
    }

    const result = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
    const score = Number(result.score) || 0;

    // スコアは仮保存（「次の問題へ」を押したときに確定）
    pendingScore = score;
    pendingResult = result;

    completeProgress();

    // 現在の暫定スコア表示
    const tentativeScores = [...scores, score];
    const correctCount = tentativeScores.filter(s => s >= 80).length;
    const avgScore = Math.round(tentativeScores.reduce((a, b) => a + b, 0) / tentativeScores.length);

    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('scoreBadge').textContent = `Score: ${score}`;
    document.getElementById('userAns').textContent = result.transcript;
    document.getElementById('betterAns').textContent = result.improved;
    document.getElementById('feedbackText').textContent = result.feedback;
    document.getElementById('correctCount').textContent = `${correctCount} / ${tentativeScores.length}`;
    document.getElementById('avgScore').textContent = avgScore;
    document.getElementById('statusText').textContent = '添削完了！';

    document.getElementById('nextBtn').style.display = 'block';
    document.getElementById('nextBtn').textContent = currentIndex + 1 >= TOTAL ? '結果を見る 🏆' : `次の問題へ ➔ (${currentIndex + 2} / ${TOTAL})`;
    document.getElementById('retryBtn').style.display = 'block';
    document.getElementById('recBtn').disabled = false;

  } catch (e) {
    completeProgress();
    document.getElementById('statusText').innerHTML = `<span style="color:red">エラー: ${e.message}</span>`;
    document.getElementById('recBtn').disabled = false;
  }
}
