<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Pronunciation Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #1D9E75; --accent-light: #E1F5EE; --accent-mid: #0F6E56; --accent-dark: #085041;
      --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efe9; --text: #1a1a18; --text-sub: #6b6b66;
      --border: rgba(0,0,0,0.10); --border-mid: rgba(0,0,0,0.18); --radius: 12px; --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18; --bg2: #242420; --bg3: #2e2e2a; --text: #e8e6de; --text-sub: #9a9890;
        --border: rgba(255,255,255,0.10); --border-mid: rgba(255,255,255,0.18);
        --accent-light: #0a3326; --accent-mid: #5DCAA5; --accent-dark: #9FE1CB;
      }
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem 4rem; }
    .container { width: 100%; max-width: 640px; }
    .header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--border-mid); }
    .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .header h1 { font-family: 'DM Serif Display', serif; font-size: 28px; font-weight: 400; letter-spacing: -0.5px; line-height: 1.2; }
    .gemini-badge { flex-shrink: 0; margin-top: 4px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: #E6F1FB; color: #185FA5; border: 0.5px solid #B5D4F4; letter-spacing: 0.04em; white-space: nowrap; }
    .header p { font-size: 13px; color: var(--text-sub); line-height: 1.6; }
    .api-section { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .api-section label { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-sub); margin-bottom: 8px; }
    .api-row { display: flex; align-items: center; gap: 8px; }
    .api-section input { flex: 1; font-family: 'DM Mono', monospace; font-size: 12px; border: 0.5px solid var(--border-mid); border-radius: var(--radius-sm); padding: 8px 12px; background: var(--bg); color: var(--text); outline: none; }
    .free-badge { flex-shrink: 0; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: #EAF3DE; color: #3B6D11; border: 0.5px solid #C0DD97; white-space: nowrap; }
    .topic-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .topic-chip { font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 0.5px solid var(--border-mid); background: var(--bg); color: var(--text-sub); cursor: pointer; transition: all 0.15s; }
    .topic-chip.active { background: var(--accent-light); color: var(--accent-mid); border-color: var(--accent); }
    .phrase-card { background: var(--bg); border: 0.5px solid var(--border-mid); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
    .phrase-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-sub); margin-bottom: 4px; }
    .phrase-text { font-family: 'DM Serif Display', serif; font-size: 20px; font-weight: 400; line-height: 1.3; color: var(--text); }
    .skip-btn { flex-shrink: 0; font-size: 12px; color: var(--text-sub); background: none; border: 0.5px solid var(--border-mid); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; }
    .conversation { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; min-height: 180px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .placeholder-msg { color: var(--text-sub); font-size: 13px; font-style: italic; margin: auto; text-align: center; }
    .msg { display: flex; flex-direction: column; gap: 5px; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg-label { font-size: 10px; font-weight: 500; text-transform: uppercase; color: var(--text-sub); }
    .msg-bubble { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; line-height: 1.7; border: 0.5px solid var(--border); background: var(--bg); }
    .msg.ai .msg-bubble { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); }
    .msg.feedback .msg-bubble { background: #FAEEDA; border-color: #FAC775; color: #412402; font-size: 13px; }
    .play-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 5px 12px; border: 0.5px solid var(--accent); background: var(--accent-light); color: var(--accent-mid); border-radius: var(--radius-sm); cursor: pointer; margin-top: 6px; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
    .rec-btn { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .rec-btn.recording { background: #FCEBEB; border-color: #E24B4A; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(226,75,74,0.35); } 50% { box-shadow: 0 0 0 12px rgba(226,75,74,0); } }
    .rec-icon { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); }
    .rec-btn.recording .rec-icon { border-radius: 5px; width: 20px; height: 20px; background: #E24B4A; }
    .status-text { font-size: 13px; color: var(--text-sub); text-align: center; min-height: 20px; }
    .status-text.active { color: var(--accent-mid); font-weight: 500; }
    .status-text.error { color: #A32D2D; font-weight: 600; padding: 10px; background: #FFF0F0; border-radius: 8px; margin-top: 10px; }
    .footer { text-align: center; font-size: 12px; color: var(--text-sub); border-top: 0.5px solid var(--border); padding-top: 1.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <h1>English Pronunciation Practice</h1>
        <span class="gemini-badge">Gemini 1.5 Flash</span>
      </div>
      <p>録音して話すと、AIが発音を判定して声で返してくれます。</p>
    </div>

    <div class="api-section">
      <label>Gemini API Key</label>
      <div class="api-row">
        <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
        <span class="free-badge">FREE</span>
      </div>
    </div>

    <div class="topic-bar" id="topicBar">
      <span class="topic-chip active" data-topic="daily conversation">Daily chat</span>
      <span class="topic-chip" data-topic="business English">Business</span>
      <span class="topic-chip" data-topic="travel situations">Travel</span>
    </div>

    <div class="phrase-card">
      <div>
        <div class="phrase-label">Try saying this</div>
        <div class="phrase-text" id="phraseText">How's your day going so far?</div>
      </div>
      <button class="skip-btn" onclick="nextPhrase()">Next</button>
    </div>

    <div class="conversation" id="conversation">
      <div class="placeholder-msg" id="placeholder">ボタンを押して話しかけてください。</div>
    </div>

    <div class="controls">
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">
        <div class="rec-icon" id="recIcon"></div>
      </button>
      <div class="status-text" id="statusText">タップして録音開始</div>
    </div>
    <div class="footer">Powered by Gemini API</div>
  </div>

  <script>
    const phrases = {
      "daily conversation": ["How's your day going so far?", "I really appreciate your help.", "That sounds like a great idea!"],
      "business English": ["Let's circle back on this later.", "Could you walk me through the process?", "We need to align our priorities."],
      "travel situations": ["Could you recommend a good restaurant?", "How long does it take to get there?", "I'd like to check in, please."]
    };

    let currentTopic = "daily conversation";
    let currentPhraseIdx = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function getKey() { return document.getElementById('apiKey').value.trim(); }
    function setStatus(msg, cls = '') {
      const el = document.getElementById('statusText');
      el.textContent = msg;
      el.className = 'status-text' + (cls ? ' ' + cls : '');
    }

    function nextPhrase() {
      const list = phrases[currentTopic];
      currentPhraseIdx = (currentPhraseIdx + 1) % list.length;
      document.getElementById('phraseText').textContent = list[currentPhraseIdx];
    }

    document.getElementById('topicBar').addEventListener('click', e => {
      const chip = e.target.closest('.topic-chip');
      if (!chip) return;
      document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentTopic = chip.dataset.topic;
      currentPhraseIdx = 0;
      document.getElementById('phraseText').textContent = phrases[currentTopic][0];
    });

    async function toggleRecord() {
      if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('recBtn').classList.remove('recording');
        setStatus('解析中...', 'active');
        return;
      }
      if (!getKey()) { setStatus('APIキーを入力してください', 'error'); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          await processAudio(blob);
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recBtn').classList.add('recording');
        setStatus('録音中... もう一度タップで停止', 'active');
      } catch (err) { setStatus('マイクを使えません', 'error'); }
    }

    async function processAudio(blob) {
      const key = getKey();
      const target = document.getElementById('phraseText').textContent;
      const base64Audio = await new Promise(r => {
        const reader = new FileReader();
        reader.onload = () => r(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });

      const prompt = `Pronunciation coach mode. Student said something for "${target}". 
      Respond ONLY with JSON: {"transcript":"(what they said)","feedback":"(short tips)","next_phrase":"(next sentence)"}`;

      try {
        // v1 エンドポイントを使用 (安定版)
        const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ inline_data: { mime_type: "audio/webm", data: base64Audio } }, { text: prompt }] }]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(text);

        const conv = document.getElementById('conversation');
        document.getElementById('placeholder')?.remove();
        
        addMsg('you', parsed.transcript);
        addMsg('feedback', parsed.feedback);

        // TTS (音声合成)
        try {
          const ttsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: parsed.next_phrase }] }],
              generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } } }
            })
          });
          const ttsData = await ttsRes.json();
          const audioData = ttsData.candidates[0].content.parts[0].inlineData.data;
          const audioUrl = `data:audio/wav;base64,${audioData}`;
          addMsg('ai', parsed.next_phrase, audioUrl);
        } catch (e) {
          addMsg('ai', parsed.next_phrase);
        }

        document.getElementById('phraseText').textContent = parsed.next_phrase;
        setStatus('完了！');
      } catch (err) {
        setStatus('エラー: ' + err.message, 'error');
      }
    }

    function addMsg(type, text, audioUrl = null) {
      const conv = document.getElementById('conversation');
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.innerHTML = `<div class="msg-label">${type === 'you' ? 'あなた' : type === 'feedback' ? 'アドバイス' : 'AI'}</div>
                       <div class="msg-bubble">${text}</div>`;
      if (audioUrl) {
        const btn = document.createElement('button');
        btn.className = 'play-btn';
        btn.innerHTML = '▶ 音声を聞く';
        btn.onclick = () => new Audio(audioUrl).play();
        div.appendChild(btn);
      }
      conv.appendChild(div);
      conv.scrollTop = conv.scrollHeight;
    }
  </script>
</body>
</html>
