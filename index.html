<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Coach AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #1D9E75; --accent-light: #E1F5EE; --accent-mid: #0F6E56;
      --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efe9; --text: #1a1a18; --text-sub: #6b6b66;
      --border: rgba(0,0,0,0.1); --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18; --bg2: #242420; --bg3: #121210; --text: #e8e6de; --text-sub: #9a9890;
        --border: rgba(255,255,255,0.1); --accent-light: #0a3326;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg3); color: var(--text); display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; }
    
    /* Header */
    .header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .header h1 { font-family: 'DM Serif Display', serif; font-size: 28px; margin-bottom: 4px; }
    .header p { font-size: 13px; color: var(--text-sub); }

    /* API Key */
    .api-section { background: var(--bg2); padding: 1.25rem; border-radius: var(--radius); margin-bottom: 1.5rem; border: 1px solid var(--border); }
    .api-section label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-sub); display: block; margin-bottom: 8px; }
    .api-section input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: monospace; }

    /* Topics */
    .topic-bar { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 1.5rem; padding-bottom: 5px; }
    .topic-chip { padding: 8px 16px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .topic-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Phrase Card */
    .phrase-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; position: relative; }
    .phrase-label { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; }
    .phrase-text { font-family: 'DM Serif Display', serif; font-size: 22px; line-height: 1.3; }
    .next-btn { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; color: var(--text-sub); }

    /* Conversation Area */
    .conversation { background: var(--bg2); border-radius: var(--radius); padding: 1.25rem; min-height: 200px; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px; border-radius: 12px; font-size: 14px; line-height: 1.6; border: 1px solid var(--border); animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
