<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>English Coach AI</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #f0f4f8; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #log { margin-top: 20px; font-size: 14px; line-height: 1.6; color: #333; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="card">
        <h2>English Coach AI</h2>
        <p style="font-size: 12px; color: #666;">Gemini 3 Flash Preview 動作確認済み</p>
        <input type="password" id="key" placeholder="Gemini API Key を入力">
        <div style="background:#e8f0fe; padding:15px; border-radius:8px; margin:15px 0; text-align:center;">
            <small>こう話しかけてみて:</small><br><strong>"How is the weather today?"</strong>
        </div>
        <button id="recBtn">🎤 話す（録音開始）</button>
        <div id="log">ここに結果が表示されます</div>
    </div>

    <script>
        let isRec = false; let recorder; let chunks = [];
        const btn = document.getElementById('recBtn');
        const log = document.getElementById('log');

        btn.onclick = async () => {
            if (isRec) { recorder.stop(); isRec = false; btn.innerText = '🎤 話す（録音開始）'; return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const base64 = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result.split(',')[1]); rd.readAsDataURL(blob); });
                    send(base64);
                };
                recorder.start(); isRec = true; btn.innerText = '🛑 録音を停止して解析';
            } catch (e) { alert('マイクを許可してください'); }
        };

        async function send(base64) {
            const key = document.getElementById('key').value;
            if(!key) { alert('キーを入力してください'); return; }
            log.innerText = 'AIが考え中...';
            try {
                // モデル名を今動いた「gemini-3-flash-preview」に固定！
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ inline_data: { mime_type: "audio/webm", data: base64 } }, { text: "Transcribe my English and give a short advice in Japanese." }] }] })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                log.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) { log.innerText = 'エラーが発生しました: ' + e.message; }
        }
    </script>
</body>
</html>
