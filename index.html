<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Correction Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #1D9E75; --bg: #ffffff; --text: #1a1a18; --text-sub: #6b6b66; --border: rgba(0,0,0,0.1); --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; background: #f0efe9; color: var(--text); display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }
    .api-section { background: var(--bg); padding: 1rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid var(--border); }
    .api-section input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 12px; }
    .result-card { background: white; border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; display: none; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .score-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .score-badge { padding: 6px 16px; background: var(--accent); color: white; border-radius: 999px; font-weight: 700; font-size: 18px; }
    .compare-section { margin-bottom: 1.5rem; }
    .compare-label { font-size: 11px; font-weight: bold; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
    .val-you { font-size: 16px; color: #E24B4A; font-weight: 600; line-height: 1.4; margin-bottom: 12px; }
    .val-better { font-size: 18px; color: var(--accent); font-weight: 700; line-height: 1.4; }
    .feedback-box { background: #f7f7f5; padding: 15px; border-radius: 10px; font-size: 14px; line-height: 1.7; border-left: 5px solid var(--accent); color: #333; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .rec-btn { width: 85px; height: 85px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 35px; transition: 0.3s; box-shadow: 0 8px 20px rgba(29, 158, 117, 0.3); }
    .rec-btn.recording { background: #E24B4A; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .status { font-size: 14px; color: var(--text-sub); font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="api-section">
      <input type="password" id="apiKey" placeholder="Gemini API Key を入力" />
    </div>

    <div id="resultCard" class="result-card">
      <div class="score-row">
        <span class="score-badge" id="scoreBadge">0</span>
        <span style="font-size: 12px; color: var(--text-sub);">Naturalness Score</span>
      </div>
      <div class="compare-section">
        <div class="compare-label">あなたが話した内容:</div>
        <div class="val-you" id="userAns"></div>
        <div class="compare-label">より自然な表現:</div>
        <div class="val-better" id="betterAns"></div>
      </div>
      <div class="feedback-box" id="feedbackText"></div>
    </div>

    <div class="controls">
      <p class="status" id="statusText">録音して添削を開始</p>
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
    </div>
  </div>

  <script>
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];

    async function toggleRecord() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) { alert('APIキーを入力してください'); return; }

      if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('recBtn').classList.remove('recording');
        document.getElementById('statusText').textContent = 'AIが分析中...';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const base64 = await new Promise(r => {
            const rd = new FileReader();
            rd.onload = () => r(rd.result.split(',')[1]);
            rd.readAsDataURL(blob);
          });
          process(base64, key);
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recBtn').classList.add('recording');
        document.getElementById('statusText').textContent = '録音中... (再タップで終了)';
      } catch (e) { alert('マイクを許可してください'); }
    }

    async function process(base64, key) {
      const prompt = `あなたはプロの英語添削講師です。生徒の音声を聞いて、以下をJSONで返してください。
      1. transcript: 聞き取った文章
      2. improved: 自然な表現
      3. score: 0-100点
      4. feedback: 日本語解説
      形式: {"transcript":"...","improved":"...","score":85,"feedback":"..."}`;

      try {
        // 最も安定しているエイリアス「gemini-1.5-flash-latest」を指定
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ inline_data: { mime_type: "audio/webm", data: base64 } }, { text: prompt }] }]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        
        const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const result = JSON.parse(jsonText);

        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('scoreBadge').textContent = result.score;
        document.getElementById('userAns').textContent = result.transcript;
        document.getElementById('betterAns').textContent = result.improved;
        document.getElementById('feedbackText').textContent = result.feedback;
        document.getElementById('statusText').textContent = '添削完了！';

      } catch (e) {
        document.getElementById('statusText').textContent = 'エラー: ' + e.message;
      }
    }
  </script>
</body>
</html>
