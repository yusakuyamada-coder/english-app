<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Coach AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #1D9E75; --bg: #f0efe9; --text: #1a1a18; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding: 1rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .phrase-card { background: #E1F5EE; padding: 1.5rem; border-radius: 12px; margin: 1.5rem 0; text-align: center; }
    .phrase-text { font-size: 20px; font-weight: 600; color: #085041; margin-bottom: 10px; }
    .api-section { background: #f7f7f5; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .api-section input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .conversation { background: #f7f7f5; padding: 10px; border-radius: 8px; min-height: 100px; margin-bottom: 1rem; font-size: 14px; }
    .msg { margin-bottom: 8px; padding: 8px; background: white; border-radius: 6px; border: 1px solid #eee; }
    .rec-btn { width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 24px; transition: 0.2s; display: block; margin: 0 auto; }
    .rec-btn.recording { background: #E24B4A; transform: scale(1.1); }
    .status { font-size: 12px; color: #666; text-align: center; margin-top: 10px; }
    .error-msg { background: #FFF0F0; color: #A32D2D; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 10px; border: 1px solid #F5C6C6; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="font-size: 20px; margin-bottom: 10px;">English Coach AI</h2>
    
    <div class="api-section">
      <input type="password" id="apiKey" placeholder="Gemini APIキーを入力 (AIza...)" />
    </div>

    <div class="phrase-card">
      <div style="font-size: 11px; opacity: 0.7;">これを言ってみて:</div>
      <div class="phrase-text" id="phraseText">Hello, how can I improve my English?</div>
    </div>

    <div class="conversation" id="conversation"></div>

    <div class="controls">
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
      <div class="status" id="statusText">タップして録音開始</div>
    </div>
    <div id="errorArea"></div>
  </div>

  <script>
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    
    // 予備のモデルリスト (2026年現在で有効なものを順に試す)
    const MODEL_CANDIDATES = [
      "gemini-3-flash",
      "gemini-3-flash-latest",
      "gemini-1.5-flash-latest",
      "gemini-1.5-flash"
    ];

    async function toggleRecord() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) { alert('キーを入力してください'); return; }

      if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('recBtn').classList.remove('recording');
        document.getElementById('statusText').textContent = '解析中...';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          await tryModels(blob, key);
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recBtn').classList.add('recording');
        document.getElementById('statusText').textContent = '録音中... 停止は再タップ';
      } catch (e) { showError('マイクが使えません'); }
    }

    async function tryModels(blob, key) {
      const base64Audio = await new Promise(r => {
        const reader = new FileReader();
        reader.onload = () => r(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });

      const prompt = `Pronunciation check. Respond ONLY JSON: {"transcript":"...","feedback":"..."}`;

      // 使えるモデルが見つかるまでループで試す
      for (const modelName of MODEL_CANDIDATES) {
        try {
          console.log(`Trying model: ${modelName}`);
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ inline_data: { mime_type: "audio/webm", data: base64Audio } }, { text: prompt }] }]
            })
          });

          const data = await res.json();
          if (data.error) {
            console.warn(`${modelName} failed: ${data.error.message}`);
            continue; // 次のモデルを試す
          }

          const result = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ''));
          addMsg('You', result.transcript);
          addMsg('AI', result.feedback);
          document.getElementById('statusText').textContent = '完了！(' + modelName + ')';
          document.getElementById('errorArea').innerHTML = ''; // エラーを消す
          return; // 成功したので終了
        } catch (e) {
          console.error(`${modelName} Exception:`, e);
        }
      }
      showError("全てのモデルでエラーが発生しました。APIキーの有効期限や、Google AI Studioでの課金設定を確認してください。");
    }

    function addMsg(label, text) {
      const conv = document.getElementById('conversation');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<b>${label}:</b> ${text}`;
      conv.prepend(div);
    }

    function showError(msg) {
      document.getElementById('errorArea').innerHTML = `<div class="error-msg">${msg}</div>`;
      document.getElementById('statusText').textContent = 'エラー';
    }
  </script>
</body>
</html>
